appId: com.riftcompass.desktop
productName: RiftCompass
directories:
  output: release
# Both native deps (@primno/dpapi, koffi) ship prebuilt binaries for the
# running Node ABI and don't need node-gyp rebuilding for Electron's ABI
# — electron-builder's default rebuild step tries to invoke node-gyp on
# them anyway and fails (missing node-addon-api, which they don't use).
npmRebuild: false
files:
  - dist/**
  - dist-electron/**
  - package.json
win:
  target: nsis
  icon: build/icons/icon.ico
  # Fixed file name (no version) so the website can link the permanent
  # releases/latest/download/RiftCompass-Setup.exe URL instead of being
  # edited on every release. electron-updater finds the file via latest.yml.
  artifactName: RiftCompass-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: build/eula.txt
# electron-updater reads this at runtime to know where to check for new
# versions — installs already on a user's machine update themselves from
# here, no need to redistribute the installer for every release.
publish:
  provider: github
  owner: RiftCompass
  repo: RiftCompass-Electron
  # Upload as a draft, never straight to players. A draft is invisible to
  # everyone and electron-updater ignores it, so the exact installer users
  # will get can be downloaded and tested first. This is electron-builder's
  # default today — it's written down so a future default can't start
  # shipping to players the moment a build finishes.
  #
  # Going public is a SEPARATE, MANUAL step today: press Publish on the
  # GitHub release. The server can do it in the nightly release window
  # (`publicar app` on mac-mini), but only once it has a fine-grained
  # GitHub token; without one it just pings the phone as a reminder.
  releaseType: draft
